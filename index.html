<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styleguide-Anzeige · Justizportal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<style>
  :root {
    --blue-900: #003064;
    --blue-700: #144b86;
    --blue-500: #3a6ea8;
    --blue-100: #e6edf5;
    --ink: #1c2226;
    --ink-soft: #55606b;
    --paper: #fbfbfa;
    --line: #dde2e7;
    --status-aktiv: #2f6b4f;
    --status-aktiv-bg: #e5f1eb;
    --status-entwurf: #9a5b12;
    --status-entwurf-bg: #f7ecdc;
    --code-bg: #f1f3f5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  a { color: var(--blue-700); }

  /* ---------- Layout ---------- */

  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  header {
    background: var(--blue-900);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--blue-700);
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header .sub {
    font-size: 12.5px;
    color: #b7c8dd;
    margin-top: 2px;
  }

  .sub-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #7a8794;
    flex-shrink: 0;
  }
  .status-dot.ok { background: #4caf7d; }
  .status-dot.err { background: #d1554a; }

  .status-text { font-size: 12.5px; color: #cfdbe9; }

  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 0;
  }

  nav {
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 18px 0 40px;
    background: #f5f6f8;
  }

  nav .empty {
    padding: 0 20px;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .kategorie-group { margin-bottom: 4px; }

  .kategorie-label {
    padding: 9px 20px 9px 20px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--blue-900);
    text-transform: none;
    cursor: default;
  }

  .datei-item {
    display: block;
    padding: 7px 20px 7px 32px;
    font-size: 13.5px;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .datei-item:hover {
    background: var(--blue-100);
    color: var(--blue-900);
  }

  .datei-item.active {
    background: var(--blue-100);
    color: var(--blue-900);
    border-left-color: var(--blue-700);
    font-weight: 500;
  }

  .datei-item.startseite {
    padding-left: 20px;
    font-weight: 600;
    color: var(--blue-900);
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
    padding-bottom: 12px;
  }

  .datei-item .entwurf-marker {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--status-entwurf);
    margin-right: 6px;
    vertical-align: middle;
  }

  section.content {
    overflow-y: auto;
    padding: 40px 48px 80px;
  }

  .content-inner { max-width: 680px; }

  .placeholder {
    color: var(--ink-soft);
    max-width: 480px;
    margin-top: 60px;
  }
  .placeholder h2 { color: var(--ink); font-size: 18px; }

  .meta-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .badge.status-aktiv { background: var(--status-aktiv-bg); color: var(--status-aktiv); }
  .badge.status-entwurf { background: var(--status-entwurf-bg); color: var(--status-entwurf); }
  .badge.scope { background: var(--blue-100); color: var(--blue-900); }

  .markdown h1 {
    font-size: 26px;
    margin: 0 0 20px;
    color: var(--blue-900);
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
  }
  .markdown h2 { font-size: 19px; margin: 32px 0 12px; color: var(--blue-900); }
  .markdown h3 { font-size: 16px; margin: 24px 0 10px; }
  .markdown p { margin: 0 0 14px; }
  .markdown ul, .markdown ol { margin: 0 0 14px; padding-left: 22px; }
  .markdown li { margin-bottom: 4px; }
  .markdown strong { color: var(--ink); }
  .markdown code {
    font-family: 'Fira Mono', monospace;
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
  }
  .markdown pre {
    background: var(--code-bg);
    padding: 12px 16px;
    border-radius: 6px;
    overflow-x: auto;
  }
  .markdown pre code { background: none; padding: 0; }
  .markdown table {
    border-collapse: collapse;
    width: 100%;
    margin: 0 0 20px;
    font-size: 13.5px;
  }
  .markdown th, .markdown td {
    border: 1px solid var(--line);
    padding: 7px 10px;
    text-align: left;
  }
  .markdown th { background: #f5f6f8; font-weight: 600; }
  .markdown blockquote {
    border-left: 3px solid var(--blue-500);
    margin: 0 0 14px;
    padding: 2px 16px;
    color: var(--ink-soft);
  }
  .markdown hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }

  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--ink-soft);
    text-align: center;
    padding: 40px;
  }

  .error-box {
    background: #fbe9e7;
    border: 1px solid #e6a49a;
    color: #7a2e22;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13.5px;
    max-width: 500px;
    margin-top: 20px;
  }

  .loading {
    color: var(--ink-soft);
    font-size: 13.5px;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Styleguide · Sprache</h1>
      <div class="sub">Justizportal — außerhalb von Confluence</div>
    </div>
    <div class="sub-right" id="statusLine">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">lädt …</span>
    </div>
  </header>

  <main>
    <nav id="nav">
      <div class="empty">Lädt Kapitel …</div>
    </nav>
    <section class="content" id="content">
      <div class="empty-state">
        <div>
          <h2 style="color:var(--ink); font-weight:600; font-size:17px; margin-bottom:8px;">Noch keine Datei ausgewählt</h2>
          <p>Links ein Kapitel öffnen und eine Regel auswählen.</p>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  const REPO = "Torsten107/justizportal-styleguide-source";
  const BRANCH = "main";
  const ROOT = "Sprache";

  let fileTree = {}; // kategorie -> [{name, path}]
  let activePath = null;

  const el = {
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    nav: document.getElementById('nav'),
    content: document.getElementById('content'),
  };

  init();

  async function init() {
    setStatus('lädt …', null);
    try {
      const tree = await fetchTree();
      buildFileTree(tree);
      renderNav();
      setStatus('geladen', 'ok');

      const startseite = (fileTree['uebersicht'] || [])[0];
      if (startseite) openFile(startseite.path);
    } catch (err) {
      setStatus(err.message, 'err');
      el.nav.innerHTML = `<div class="empty">Kapitel konnten nicht geladen werden.</div>`;
    }
  }

  function setStatus(text, kind) {
    el.statusText.textContent = text;
    el.statusDot.className = 'status-dot' + (kind ? ' ' + kind : '');
  }

  async function ghFetch(url) {
    const res = await fetch(url, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if (res.status === 401 || res.status === 403) {
      throw new Error('Zugriff verweigert — ist das Repo öffentlich?');
    }
    if (res.status === 404) {
      throw new Error('Repo oder Pfad nicht gefunden');
    }
    if (!res.ok) {
      throw new Error(`GitHub-Fehler (${res.status})`);
    }
    return res.json();
  }

  async function fetchTree() {
    const data = await ghFetch(
      `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`
    );
    return data.tree.filter(item =>
      item.type === 'blob' &&
      item.path.startsWith(ROOT + '/') &&
      item.path.endsWith('.md')
    );
  }

  // Reihenfolge, in der Kategorien angezeigt werden — Übersicht und ToV
  // stehen bewusst oben, da sie die allgemeinsten/grundlegendsten Kapitel sind
  const KATEGORIE_ORDER = ['uebersicht', 'tone-of-voice', 'schreibregeln', 'wortnutzung', 'struktur', 'stil', 'unbekannt'];
  const KATEGORIE_LABEL = {
    uebersicht: 'Sprache (Start)',
    'tone-of-voice': 'Tone of Voice',
    schreibregeln: 'Schreibregeln',
    wortnutzung: 'Wortnutzung',
    struktur: 'Struktur',
    stil: 'Stil',
    unbekannt: 'Sonstiges'
  };

  // Bekannte Sonderfälle, die direkt im Wurzelordner liegen (kein Unterordner)
  // und daher nicht über die Ordnerstruktur erkannt werden können.
  const ROOT_FILE_KATEGORIE = {
    'Sprache.md': 'uebersicht',
    'Tone of Voice - A2J.md': 'tone-of-voice',
  };

  function guessKategorieFromPath(path) {
    const parts = path.split('/');
    for (const known of ['Schreibregeln', 'Wortnutzung', 'Struktur', 'Stil']) {
      if (parts.includes(known)) return known.toLowerCase();
    }
    const filename = parts[parts.length - 1];
    if (ROOT_FILE_KATEGORIE[filename]) return ROOT_FILE_KATEGORIE[filename];
    return null;
  }

  function buildFileTree(items) {
    fileTree = {};
    for (const item of items) {
      const name = item.path.split('/').pop().replace(/\.md$/, '');
      const kategorie = guessKategorieFromPath(item.path) || 'unbekannt';
      if (!fileTree[kategorie]) fileTree[kategorie] = [];
      fileTree[kategorie].push({ name, path: item.path });
    }
    for (const k in fileTree) {
      fileTree[k].sort((a, b) => a.name.localeCompare(b.name, 'de'));
    }
  }

  function renderNav() {
    const startseite = (fileTree['uebersicht'] || [])[0];
    const groups = KATEGORIE_ORDER.filter(k => k !== 'uebersicht' && fileTree[k]);

    if (!startseite && groups.length === 0) {
      el.nav.innerHTML = `<div class="empty">Keine Markdown-Dateien gefunden.</div>`;
      return;
    }

    const startseiteHtml = startseite
      ? `<a class="datei-item startseite" data-path="${startseite.path}">Sprache — Start</a>`
      : '';

    const gruppenHtml = groups.map(kat => `
      <div class="kategorie-group">
        <div class="kategorie-label">${KATEGORIE_LABEL[kat] || kat}</div>
        ${fileTree[kat].map(f => `
          <a class="datei-item" data-path="${f.path}">${f.name}</a>
        `).join('')}
      </div>
    `).join('');

    el.nav.innerHTML = startseiteHtml + gruppenHtml;

    el.nav.querySelectorAll('.datei-item').forEach(elm => {
      elm.addEventListener('click', () => openFile(elm.dataset.path));
    });
  }

  function decodeBase64Utf8(b64) {
    const binary = atob(b64.replace(/\n/g, ''));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function parseFrontmatter(raw) {
    const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if (!match) return { meta: {}, body: raw };
    const [, fmBlock, body] = match;
    const meta = {};
    fmBlock.split('\n').forEach(line => {
      const m = line.match(/^([a-zA-Z_]+):\s*(.*)$/);
      if (!m) return;
      let [, key, value] = m;
      value = value.trim();
      if (value.startsWith('[') && value.endsWith(']')) {
        meta[key] = value.slice(1, -1).split(',').map(s => s.trim()).filter(Boolean);
      } else {
        meta[key] = value;
      }
    });
    return { meta, body };
  }

  async function openFile(path) {
    activePath = path;
    document.querySelectorAll('.datei-item').forEach(elm => {
      elm.classList.toggle('active', elm.dataset.path === path);
    });
    el.content.innerHTML = `<div class="loading">Lädt …</div>`;

    try {
      const data = await ghFetch(
        `https://api.github.com/repos/${REPO}/contents/${encodeURI(path)}?ref=${BRANCH}`
      );
      const raw = decodeBase64Utf8(data.content);
      const { meta, body } = parseFrontmatter(raw);
      renderContent(meta, body);
    } catch (err) {
      el.content.innerHTML = `<div class="error-box">Datei konnte nicht geladen werden: ${err.message}</div>`;
    }
  }

  function renderContent(meta, body) {
    const statusBadge = meta.status
      ? `<span class="badge status-${meta.status}">${meta.status}</span>`
      : '';
    const scopeBadges = (meta.geltungsbereich || [])
      .map(s => `<span class="badge scope">${s}</span>`).join('');

    const html = marked.parse(body, { headerIds: false, mangle: false });

    el.content.innerHTML = `
      <div class="content-inner">
        <div class="meta-bar">${statusBadge}${scopeBadges}</div>
        <div class="markdown">${html}</div>
      </div>
    `;
  }
</script>

</body>
</html>
